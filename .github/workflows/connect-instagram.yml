name: connect-instagram

# One-time Instagram connection. connect.html opens an issue titled "connect-instagram" whose body is the
# single-use login code; this job swaps it for a 60-day token (stored encrypted) and wipes the code.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: newsdesk
  cancel-in-progress: false

jobs:
  connect:
    if: (github.event.issue.title == 'connect-instagram' || github.event.issue.title == 'connect-facebook' || github.event.issue.title == 'connect-linkedin') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove the code from the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit ${{ github.event.issue.number }} -R ${{ github.repository }} --body "Connecting Instagram…"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Exchange code for token
        id: connect
        env:
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          TITLE: ${{ github.event.issue.title }}
          CODE: ${{ github.event.issue.body }}
          NEWSDESK_DATA_DIR: data
        run: |
          set -o pipefail
          case "$TITLE" in connect-facebook) CMD=connect-fb;; connect-linkedin) CMD=connect-li;; *) CMD=connect;; esac
          python -m newsdesk $CMD --code "$CODE" | tee result.txt

      - name: Save state
        if: success()
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "newsdesk-bot"
          git config user.email "newsdesk-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -q -m "connect $TITLE"
          git pull --rebase -q || true
          git push -q

      - name: Report back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.connect.outcome }}" = "success" ]; then
            gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} -c "✅ $(tail -1 result.txt)"
          else
            gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} -c "❌ Connection failed: $(tail -1 result.txt 2>/dev/null). Open connect.html and try again."
          fi

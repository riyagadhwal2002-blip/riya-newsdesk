name: linkedin-preview

# Manual: writes 5 sample LinkedIn posts (nothing is published) into data/linkedin_previews.json
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: newsdesk
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Write sample posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWSDESK_DATA_DIR: data
        run: python -m newsdesk linkedin-preview
      - name: Save
        run: |
          git config user.name "newsdesk-bot"
          git config user.email "newsdesk-bot@users.noreply.github.com"
          git add data/linkedin_previews.json
          git diff --cached --quiet || git commit -q -m "linkedin previews"
          git pull --rebase -q || true
          git push -q

name: newsdesk

# Checks every 10 minutes on GitHub's servers (free), even when your laptop is off.
# GitHub often delays or skips scheduled runs, so checking often keeps posts close to every 30 min;
# publishing.min_gap_minutes (25) stops it posting more often than that.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: newsdesk
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "newsdesk-bot"
          git config user.email "newsdesk-bot@users.noreply.github.com"

      - name: Check news and post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOSTING: git
          NEWSDESK_DATA_DIR: data
          PUBLIC_DIR: public
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/public
        run: python -m newsdesk run-once

      - name: Save state
        if: always()
        run: |
          git add -A data public
          git diff --cached --quiet || git commit -q -m "state $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push -q || true

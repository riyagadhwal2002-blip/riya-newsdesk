    "socialmediatoday.com", "variety.com", "hollywoodreporter.com", "deadline.com", "economictimes.indiatimes.com",
    "brandequity.economictimes.indiatimes.com", "livemint.com", "moneycontrol.com", "business-standard.com",
    "thehindubusinessline.com", "hindustantimes.com", "indianexpress.com", "ndtv.com", "timesofindia.indiatimes.com",
    "afaqs.com", "exchange4media.com", "inc42.com", "entrackr.com", "yourstory.com", "news18.com", "fastcompany.com",
    "axios.com", "theinformation.com", "mashable.com", "lbbonline.com", "prweek.com", "inc.com", "standard.co.uk",
